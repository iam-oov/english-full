name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version is derived from the commit count.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # v1.0.0 anchored at commit #32 (the commit that introduced versioning);
      # each commit deployed afterwards bumps the patch by one. Tied to the
      # history, so manual re-runs don't inflate the version.
      - id: version
        run: echo "version=v1.0.$(( $(git rev-list --count HEAD) - 32 ))" >> "$GITHUB_OUTPUT"

      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
          PUBLIC_BUILD_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
